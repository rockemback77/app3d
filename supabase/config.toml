# Config do Supabase CLI para este projeto.
# O webhook do Mercado Pago é anônimo (o MP não manda JWT do Supabase),
# então a verificação de JWT fica desligada para essa função.

project_id = "xsfeemdgkdsfdommxztw"

[functions.mp-webhook]
verify_jwt = false

# Checkout: cria o preapproval. Protegida — só usuário logado (JWT válido).
[functions.mp-create-subscription]
verify_jwt = true

# Cancelamento da assinatura. Protegida — só usuário logado.
[functions.mp-cancel-subscription]
verify_jwt = true
